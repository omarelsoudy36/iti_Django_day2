{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Django Game Hub Menu</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        .menu-box {
            background: white;
            border-radius: 12px;
            padding: 35px;
            margin: 40px auto;
            max-width: 500px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .menu-btn {
            display: block;
            width: 80%;
            margin: 15px auto;
            padding: 15px;
            text-decoration: none;
            color: white;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            transition: transform 0.2s;
        }
        .menu-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <h1>🎮 Welcome to Django Game Hub 🎮</h1>
    <p>Select a game to start playing directly!</p>

    <div class="menu-box">
        <!-- الأزرار دي بتنقلك للروابط الفرعية تلقائياً بضغطة واحدة -->
        <a href="{% url 'rps' %}" class="menu-btn" style="background-color: #3498db;">1. Rock Paper Scissors 🪨📄✂️</a>
        <a href="{% url 'guess' %}" class="menu-btn" style="background-color: #2ecc71;">2. Number Guessing 🎯</a>
        <a href="{% url 'lucky' %}" class="menu-btn" style="background-color: #9b59b6;">3. Lucky Fortune Teller 🔮</a>
    </div>
</body>
</html>
